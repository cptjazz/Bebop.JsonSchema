name: Pack and Publish

on:
  release:
    types: [published]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - uses: actions/checkout@v7
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Pack NuGet package
      run: dotnet pack Bebop.JsonSchema/Bebop.JsonSchema.csproj --no-build --configuration Release --output ./nupkg
    
    - name: Upload NuGet package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ./nupkg/
    
    - name: Push to NuGet
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Push to GitHub Packages
      run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ github.token }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
